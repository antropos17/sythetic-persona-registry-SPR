<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Synthetic Persona Registry</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:wght@400;500&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: an international registry. Navy bands carry the agency (header, hero with the 3D passport, footer); white pages carry the work (notices grid, records, forms). Colour-coded notices are the system's language; the passport is the one rich object. */
:root{
  --navy:#0B2550; --navy-deep:#071A3A; --navy-2:#163A73; --navy-line:#2A4677; --on-navy:#FFFFFF; --on-navy-2:#B9C6DC;
  --paper:#FFFFFF; --mist:#EEF2F7; --mist-2:#E1E7F0; --rule:#CAD3E0; --ink:#0A1424; --muted:#4A5873; --link:#1F4FBF;
  --focus:#FFB700;
  --g:#12804A; --g-tint:#E3F2EA; --g-ink:#0B5A33;
  --y:#E5A800; --y-tint:#FDF3D6; --y-ink:#6B4E00;
  --o:#D9590F; --o-tint:#FCE6D9; --o-ink:#8A3200;
  --r:#C3112B; --r-tint:#F9DDE1; --r-ink:#8E0B1F;
  --sans:Archivo,"Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--navy-deep)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--link);text-underline-offset:.18em}
a:hover{text-decoration-thickness:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wide{font-stretch:125%}
[tabindex="-1"]:focus{outline:none}
.skip{position:absolute;left:12px;top:-60px;z-index:60;background:var(--focus);color:var(--ink);padding:10px 14px;font-weight:700}
.skip:focus{top:calc(8px + env(safe-area-inset-top,0px))}

/* bars */
.util{background:var(--navy-deep);color:var(--on-navy-2);font-size:13.5px}
.util .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 24px;padding-block:7px}
.hdr{background:var(--navy);color:var(--on-navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 1px 0 var(--navy-line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 28px;padding-block:10px;flex-wrap:wrap}
.brand{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none;min-height:52px}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-stretch:125%;font-weight:850;font-size:24px;letter-spacing:.06em}
.brand .wm small{font-stretch:112%;font-size:11.5px;letter-spacing:.08em;color:var(--on-navy-2);margin-top:5px;font-weight:600}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.nav a{color:#fff;text-decoration:none;font-weight:600;font-size:15.5px;padding:0 12px;min-height:44px;display:inline-flex;align-items:center;box-shadow:inset 0 -3px 0 transparent;transition:box-shadow .2s var(--ease)}
.nav a:hover{box-shadow:inset 0 -3px 0 var(--on-navy-2)}
.nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 #fff}
.kbtn{display:inline-flex;align-items:center;gap:10px;min-height:42px;padding:0 10px 0 12px;background:var(--navy-deep);border:1px solid var(--navy-line);color:var(--on-navy-2);border-radius:2px;cursor:pointer;font-size:15px}
.kbtn:hover{border-color:var(--on-navy-2);color:#fff}
.kbd{font-family:var(--mono);font-size:12px;padding:1px 6px;border:1px solid currentColor;border-radius:2px;opacity:.8}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border:0;border-radius:2px;background:var(--navy);color:#fff;font-weight:700;font-size:16.5px;text-decoration:none;cursor:pointer;transition:background-color .15s var(--ease)}
.btn:hover{background:var(--navy-2);color:#fff}
.btn:active{background:var(--navy-deep)}
.btn.light{background:#fff;color:var(--navy)}
.btn.light:hover{background:var(--mist)}
.btn.line{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.btn.line:hover{background:var(--mist)}
.btn.line-w{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.btn.line-w:hover{box-shadow:inset 0 0 0 2px #fff}
.btn[disabled]{opacity:.45;cursor:default}
.tlink{all:unset;cursor:pointer;color:var(--link);text-decoration:underline;text-underline-offset:.18em;font-weight:600}
.tlink:hover{text-decoration-thickness:2px}
.tlink:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* hero */
.hero{background:var(--navy);color:#fff;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:32px 48px;align-items:center;padding-block:56px 64px}
@media (max-width:980px){.hero .wrap{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-stretch:118%;font-weight:800;font-size:clamp(36px,4.6vw,60px);line-height:1.02;letter-spacing:-.012em;max-width:14ch}
.hero .lede{color:var(--on-navy-2);font-size:19px;max-width:42ch;margin-top:18px}
.verify{margin-top:30px;max-width:540px;position:relative}
.verify label{display:block;font-weight:700;margin-bottom:8px}
.verify .row{display:flex;gap:0}
.verify input{flex:1 1 auto;min-width:0;min-height:56px;padding:0 16px;border:0;border-radius:2px 0 0 2px;background:#fff;color:var(--ink);font-family:var(--mono);font-size:17px}
.verify input:focus{outline:3px solid var(--focus);outline-offset:0}
.verify .btn{min-height:56px;border-radius:0 2px 2px 0;background:var(--focus);color:var(--ink)}
.verify .btn:hover{background:#FFC93D}
.try{margin-top:12px;font-size:15px;color:var(--on-navy-2);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.try button{all:unset;cursor:pointer;color:#fff;text-decoration:underline;text-underline-offset:.18em;font-family:var(--mono);font-size:14.5px}
.try button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vres{margin-top:16px;display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--navy-deep);border-left:5px solid var(--nc,#fff)}
.vres img{width:46px;height:56px;object-fit:cover;object-position:50% 30%;background:var(--mist)}
.vres .t{flex:1 1 auto;min-width:0}
.vres b{display:block}
.vres span{color:var(--on-navy-2);font-size:14.5px}
.stage{position:relative;max-width:100%}
.stage .viewer{aspect-ratio:1.25}
.stage .globe{position:absolute;inset:-6% -14% -6% -6%;opacity:.16;pointer-events:none}
.vbox{position:relative;display:flex;flex-direction:column}
.viewer{position:relative;width:100%;max-width:100%}
.viewer:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.viewer canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:pan-y;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:var(--on-navy-2);font-size:15px;padding:16px;text-align:center}
.vmsg img{max-height:100%;width:auto}
.vctl{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;padding:10px 0 0}
.vbtns{display:flex;gap:8px}
.vctl .hint{font-size:13.5px;color:var(--on-navy-2)}
.vbtn{min-height:44px;padding:0 16px;border-radius:2px;border:1px solid rgba(255,255,255,.35);background:rgba(7,26,58,.72);color:#fff;font-weight:600;font-size:14.5px;cursor:pointer}
.vbtn:hover{border-color:#fff}

/* sections */
.sec{padding-block:72px}
.sec-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 40px;margin-bottom:28px}
.h2{font-stretch:118%;font-weight:800;font-size:clamp(28px,3.2vw,40px);line-height:1.06;letter-spacing:-.01em}
.sub{color:var(--muted);max-width:56ch;margin-top:10px}

/* notice key */
.key{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:28px}
@media (max-width:860px){.key{grid-template-columns:repeat(2,minmax(0,1fr))}}
.key button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:18px 18px 18px 20px;border-left:1px solid var(--rule);position:relative;transition:background-color .15s var(--ease)}
.key button:first-child{border-left:0}
.key button::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--nc)}
.key button:hover{background:var(--mist)}
.key button[aria-pressed="true"]{background:var(--nt)}
.key button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.key .nm{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-stretch:112%}
.key .ct{font-family:var(--mono);font-weight:500;color:var(--muted)}
.key .ad{color:var(--muted);font-size:15px}
@media (max-width:860px){.key button:nth-child(3){border-left:0}.key button:nth-child(n+3){border-top:1px solid var(--rule)}}

.tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.tools .l{display:flex;flex-wrap:wrap;gap:10px;align-items:center;flex:1 1 320px;min-width:0}
.field-in{min-height:46px;padding:0 14px;border:1.5px solid #8C99AF;border-radius:2px;background:#fff;min-width:0;flex:1 1 240px;max-width:380px}
.field-in:focus{outline:3px solid var(--focus);outline-offset:0;border-color:var(--navy)}
.sel{min-height:46px;padding:0 34px 0 12px;border:1.5px solid #8C99AF;border-radius:2px;background:#fff;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.viewsw{display:inline-flex;border:1.5px solid #8C99AF;border-radius:2px}
.viewsw button{all:unset;cursor:pointer;min-height:43px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--muted)}
.viewsw button[aria-pressed="true"]{background:var(--navy);color:#fff}
.viewsw button:focus-visible{outline:3px solid var(--focus);outline-offset:0}
.status-line{color:var(--muted);font-size:15px}
.clear{margin-left:6px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.card{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--rule);transition:border-color .15s var(--ease)}
.card:hover{border-color:var(--navy)}
.card .band{height:6px;background:var(--nc)}
.card .ph{aspect-ratio:4/5;background:var(--mist);overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px}
.card h3{font-stretch:112%;font-weight:800;font-size:20px;line-height:1.15}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0}
.card h3 a:focus-visible{outline:none}
.card:has(a:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.card .no{font-family:var(--mono);font-size:14px;color:var(--muted)}
.card .meta{font-size:14.5px;color:var(--muted)}
.card-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:8px}
.card-actions .ntag{margin-top:0}
.save-action{position:relative;z-index:1;font-size:14.5px}
.saved-filter{min-height:44px;padding:0 14px;border:1.5px solid #8C99AF;border-radius:2px;background:#fff;color:var(--navy);font-weight:700;cursor:pointer}
.saved-filter[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.saved-filter:hover{border-color:var(--navy)}
.rec-save{display:block;margin-top:10px}
.ntag{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ni);background:var(--nt);padding:3px 9px 3px 8px;align-self:flex-start;margin-top:8px;border-radius:2px}
.ntag i{width:9px;height:9px;background:var(--nc);display:inline-block}
.tbl-box{overflow-x:auto;border-top:2px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;font-size:14px;font-weight:700;color:var(--muted);padding:12px 18px 12px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:12px 18px 12px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
td .thumb{width:40px;height:48px;object-fit:cover;object-position:50% 32%;background:var(--mist);display:block}
td a{font-weight:700;color:var(--ink)}
.empty{padding:40px 0;color:var(--muted)}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));counter-reset:s;position:relative}
.steps li{counter-increment:s;padding:0 18px 0 0;position:relative}
.steps li::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;position:relative;z-index:1;margin-bottom:14px}
.steps li::after{content:"";position:absolute;top:20px;left:40px;right:0;height:2px;background:var(--rule)}
.steps li:last-child::after{display:none}
.steps h3{font-stretch:112%;font-size:18px;font-weight:800;margin-bottom:4px}
.steps p{color:var(--muted);font-size:15.5px}
@media (max-width:900px){.steps{grid-template-columns:minmax(0,1fr);gap:4px}.steps li{padding:0 0 22px 58px}.steps li::before{position:absolute;left:0;top:0;margin:0}.steps li::after{top:42px;left:19px;width:2px;height:auto;bottom:0;right:auto}}

/* services */
.svc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.svc{grid-template-columns:minmax(0,1fr)}}
.svc > div{padding:32px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.svc .a{background:var(--navy);color:#fff}
.svc .a p{color:var(--on-navy-2)}
.svc .b{background:var(--mist);border-top:5px solid var(--r)}
.svc h3{font-stretch:118%;font-weight:800;font-size:26px;line-height:1.1}
.svc .time{font-size:14.5px;font-weight:600}

/* record */
.rec-top{border-top:8px solid var(--nc);background:var(--mist)}
.crumbs{display:flex;flex-wrap:wrap;list-style:none;margin:0;padding:18px 0 0;gap:4px 10px;font-size:15px}
.crumbs li+li::before{content:"/";color:var(--muted);margin-right:10px}
.rec-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px 28px;align-items:end;padding-block:24px 32px}
@media (max-width:1100px){.rec-head{grid-template-columns:auto minmax(0,1fr)}.rec-head .acts{grid-column:1/-1}}
.rec-photo{width:132px;aspect-ratio:4/5;object-fit:cover;object-position:50% 32%;background:#fff;border:1px solid var(--rule);display:block}
@media (max-width:520px){.rec-photo{width:92px}}
.rec-head h1{font-stretch:122%;font-weight:850;font-size:clamp(34px,5vw,64px);line-height:.98;letter-spacing:-.015em}
.rec-head .no{font-family:var(--mono);font-size:16px;color:var(--muted);margin-bottom:8px;display:block}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.rec-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px 48px;padding-block:36px 8px;align-items:start}
@media (max-width:980px){.rec-grid{grid-template-columns:minmax(0,1fr)}}
.rec-stage{background:var(--navy);padding:0 12px 12px;max-width:100%}
.rec-stage .viewer{aspect-ratio:1.3}
.rec-images{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr);gap:32px 48px;align-items:start;margin-top:40px;padding:32px;background:var(--mist);border-top:1px solid var(--rule)}
.rec-images .h2{font-size:clamp(26px,2.8vw,36px)}
.rec-images .sub{max-width:42ch}
.rec-image-key{display:flex;align-items:center;gap:14px;margin-top:28px;max-width:400px;padding-top:18px;border-top:1px solid var(--rule)}
.rec-image-key img{width:72px;aspect-ratio:4/5;object-fit:cover;flex:0 0 auto;background:#fff;border:1px solid var(--rule)}
.rec-image-key b{display:block;font-size:16px}
.rec-image-key p{color:var(--muted);font-size:14px}
.rec-full{margin:0;justify-self:center;width:min(100%,420px);background:#fff;border:1px solid var(--rule)}
.rec-full img{display:block;width:100%;height:auto;aspect-ratio:2/3;object-fit:contain}
.rec-full figcaption{padding:10px 14px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
@media (max-width:760px){.rec-images{grid-template-columns:minmax(0,1fr);gap:24px}.rec-full{justify-self:start}}
.dl{margin:0;border-top:2px solid var(--ink)}
.dl div{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:2px 18px;padding:11px 0;border-bottom:1px solid var(--rule)}
@media (max-width:480px){.dl div{grid-template-columns:minmax(0,1fr)}}
.dl dt{color:var(--muted);font-size:15px}
.dl dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.notice-box{display:flex;gap:14px;padding:16px 18px;background:var(--nt);border-left:6px solid var(--nc);margin-top:20px}
.notice-box b{display:block;color:var(--ni);font-stretch:112%}
.tabs{margin-top:44px}
.tablist{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--ink);gap:4px}
.tablist button{all:unset;cursor:pointer;padding:12px 18px;font-weight:700;color:var(--muted);box-shadow:inset 0 -4px 0 transparent;margin-bottom:-2px}
.tablist button:hover{color:var(--ink)}
.tablist button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -4px 0 var(--navy)}
.tablist button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.panel{padding-top:24px;min-height:180px;scroll-margin-top:96px}
.checks{list-style:none;margin:0 0 20px;padding:0;max-width:760px}
.checks li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);color:var(--muted)}
.checks li.done{color:var(--ink)}
.checks .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.checks li.run .mk{border-color:var(--navy);border-right-color:transparent;animation:spin .7s linear infinite}
.checks li.ok .mk{background:var(--g);border-color:var(--g)} .checks li.warn .mk{background:var(--y);border-color:var(--y);color:var(--ink)} .checks li.bad .mk{background:var(--r);border-color:var(--r)}
.checks .d{font-family:var(--mono);font-size:14px;color:var(--muted);text-align:right;overflow-wrap:anywhere}
@keyframes spin{to{transform:rotate(360deg)}}
.verdict{padding:16px 18px;border-left:6px solid var(--nc);background:var(--nt);font-weight:700;max-width:760px;margin-bottom:20px;color:var(--ni)}
.hist{margin:0;max-width:760px}
.hist div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 20px;padding:12px 0;border-bottom:1px solid var(--rule)}
@media (max-width:480px){.hist div{grid-template-columns:minmax(0,1fr)}}
.hist dt{font-family:var(--mono);font-size:14px;color:var(--muted);padding-top:2px}
.hist dd{margin:0}
.risk{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule);max-width:760px}
.risk .ex{flex:0 0 28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900}
.pager{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--rule);margin-top:56px;padding-top:20px}
.pager a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);font-weight:700;min-width:0}

.opt input[type="radio"]::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--ink);transform:scale(0);transition:transform .12s var(--ease)}
.opt input[type="checkbox"]::before{content:"";width:14px;height:8px;border:solid var(--ink);border-width:0 0 3px 3px;transform:rotate(-45deg) scale(0);margin-top:-4px;transition:transform .12s var(--ease)}
.opt input:checked::before{transform:scale(1)}

function createViewer(el){
  const T=window.THREE; if(!T) throw new Error('3D library unavailable');
  const renderer=new T.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputColorSpace=T.SRGBColorSpace;
  renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;
  el.appendChild(renderer.domElement);

  const tex=(c,srgb)=>{const t=new T.CanvasTexture(c);if(srgb!==false)t.colorSpace=T.SRGBColorSpace;t.anisotropy=maxAniso;return t;};

  const scene=new T.Scene();
  const camera=new T.PerspectiveCamera(28,1,.1,60);
  const pm=new T.PMREMGenerator(renderer);
  const env=new T.Scene();
  env.add(new T.Mesh(new T.BoxGeometry(14,14,14),new T.MeshBasicMaterial({color:0x8d8a83,side:T.BackSide})));
  const panel=(w,h,p,rot,c)=>{const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:c,side:T.DoubleSide}));m.position.set(...p);m.rotation.set(...rot);env.add(m);};
  panel(7,2.4,[0,5,2],[Math.PI/2,0,0],0xffffff);
  panel(3,4,[-6,1,2],[0,Math.PI/2,0],0xffe0b0);
  panel(3,4,[6,0,3],[0,-Math.PI/2,0],0xb8ccff);
  panel(10,1.2,[0,-1.5,6.5],[0,0,0],0xffffff);
  scene.environment=pm.fromScene(env,.04).texture;
  scene.add(new T.HemisphereLight(0xffffff,0x8a8678,.75));
  const key=new T.DirectionalLight(0xffffff,1.5);key.position.set(2.5,3.2,5);scene.add(key);
  const rim=new T.DirectionalLight(0xffd59a,.55);rim.position.set(-4,-1.5,2.5);scene.add(rim);

  const W=1,H=1.42,TH=.07,CT=.022;
  const root=new T.Group();scene.add(root);
  const book=new T.Group();root.add(book);
  const paperEdge=new T.MeshStandardMaterial({color:0xe9e5d6,roughness:.95});
  const navy=new T.MeshStandardMaterial({color:0x12285a,roughness:.62});
  const blank=new T.MeshStandardMaterial({color:0xe9e7dd,roughness:.92});
  const dataMat=new T.MeshStandardMaterial({roughness:.8,metalness:0});
  const rightGeo=new T.BoxGeometry(W,H,TH);rightGeo.translate(W/2,0,-TH/2);
  book.add(new T.Mesh(rightGeo,[paperEdge,navy,paperEdge,paperEdge,dataMat,navy]));

  const holoMat=new T.ShaderMaterial({
    uniforms:{mask:{value:tex(TEX.holoMask(),false)},uTime:{value:0},uTilt:{value:new T.Vector2()}},
    vertexShader:'varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){vUv=uv;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.0);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
    fragmentShader:'uniform sampler2D mask;uniform float uTime;uniform vec2 uTilt;varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){float f=clamp(dot(normalize(vN),normalize(vV)),0.0,1.0);float t=vUv.x*1.3+vUv.y*.7+(1.0-f)*3.2+uTilt.x*2.2+uTilt.y*1.4+uTime*.025;vec3 col=.5+.5*cos(6.28318*(t+vec3(0.0,.33,.67)));float m=texture2D(mask,vUv).r;float a=m*(.05+.30*(1.0-f)+.12*abs(uTilt.x));a=min(a,.32);gl_FragColor=vec4(mix(col,vec3(.62,.72,.95),.25),a);}',
    transparent:true,depthWrite:false,blending:T.NormalBlending});
  const holo=new T.Mesh(new T.PlaneGeometry(W*.97,H*.97),holoMat);holo.position.set(W/2,0,.0016);book.add(holo);

  const coverPivot=new T.Group();coverPivot.position.set(0,0,.0004);book.add(coverPivot);
  const coverGeo=new T.BoxGeometry(W+.012,H+.014,CT);coverGeo.translate(W/2+.006,0,CT/2);
  const coverOut=new T.MeshStandardMaterial({map:tex(TEX.cover()),metalnessMap:tex(TEX.coverMask(true),false),roughnessMap:tex(TEX.coverMask(false),false),metalness:1,roughness:1,color:0xffffff});
  const coverIn=new T.MeshStandardMaterial({roughness:.82});
  coverPivot.add(new T.Mesh(coverGeo,[navy,navy,navy,navy,coverOut,coverIn]));

  const PN=36, PGW=W, PGH=H, seg=PGW/PN;
  const pageGeoF=new T.PlaneGeometry(PGW,PGH,PN,1), pageGeoB=pageGeoF.clone();
  { const uv=pageGeoB.attributes.uv; for(let i=0;i<uv.count;i++) uv.setX(i,1-uv.getX(i)); uv.needsUpdate=true; }
  const flipFront=new T.MeshStandardMaterial({roughness:.8,side:T.FrontSide}), flipBack=new T.MeshStandardMaterial({roughness:.82,side:T.BackSide});
  const flip=new T.Group();
  flip.add(new T.Mesh(pageGeoF,flipFront));flip.add(new T.Mesh(pageGeoB,flipBack));
  flip.visible=false;book.add(flip);
  const pxA=new Float32Array(PN+1), pzA=new Float32Array(PN+1);
  function bend(p){
    pxA[0]=0;pzA[0]=0;
    for(let i=0;i<PN;i++){
      let t=p*1.5-.5*((i+.5)/PN); t=t<0?0:t>1?1:t; t=t*t*(3-2*t);
      const th=Math.PI*t; pxA[i+1]=pxA[i]+seg*Math.cos(th); pzA[i+1]=pzA[i]+seg*Math.sin(th);
    }
    const lift=.0034+Math.sin(p*Math.PI)*.014;
    [pageGeoF,pageGeoB].forEach(g=>{const pos=g.attributes.position;for(let r=0;r<2;r++)for(let c=0;c<=PN;c++){const i=r*(PN+1)+c;pos.setX(i,pxA[c]);pos.setZ(i,pzA[c]+lift);}pos.needsUpdate=true;g.computeVertexNormals();});
  }
  bend(0);

  const sh=document.createElement('canvas');sh.width=sh.height=256;const sx=sh.getContext('2d');
  const sg=sx.createRadialGradient(128,128,10,128,128,128);sg.addColorStop(0,'rgba(0,4,16,.55)');sg.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=sg;sx.fillRect(0,0,256,256);
  const shadow=new T.Mesh(new T.PlaneGeometry(3.4,2.6),new T.MeshBasicMaterial({map:tex(sh),transparent:true,depthWrite:false}));
  shadow.position.set(.06,-.12,-.45);root.add(shadow);

  const cache=new Map();
  const getTex=(k,fn)=>{if(!cache.has(k))cache.set(k,tex(fn()));return cache.get(k);};

  let openP=0, tweens=[], current=null, opening=null, turning=null, pending=null;
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const easeIO=t=>-(Math.cos(Math.PI*t)-1)/2;
  const tween=(dur,fn,done)=>{const tw={s:performance.now(),dur,fn,done};tweens.push(tw);return tw;};
  function applyOpen(){
    const e=ease(openP);
    coverPivot.rotation.y=-Math.PI*e;
    coverPivot.position.z=.0004+Math.sin(e*Math.PI)*.02;
    book.position.x=(-W/2)*(1-e);
  }
  function setOpen(want,instant){
    const from=openP,to=want?1:0;
    if(opening){tweens=tweens.filter(t=>t!==opening);opening=null;}
    if(instant||REDUCED||from===to){openP=to;applyOpen();flush();return;}
    opening=tween(1800*Math.abs(to-from),t=>{openP=from+(to-from)*t;applyOpen();},()=>{opening=null;flush();});
  }
  const texFor=p=>[getTex('d'+p.id,()=>TEX.dataPage(p)),getTex('e'+p.id,()=>TEX.endorsements(p))];
  function swapNow(p){const [dT,eT]=texFor(p);dataMat.map=dT;coverIn.map=eT;dataMat.needsUpdate=coverIn.needsUpdate=true;current=p;}
  function turnTo(p){
    const [dT,eT]=texFor(p);
    const n=PEOPLE.length, d=(PEOPLE.indexOf(p)-PEOPLE.indexOf(current)+n)%n, fwd=d<=n/2;
    if(fwd){
      flipFront.map=dataMat.map;flipBack.map=eT;
      dataMat.map=dT;
    }else{
      flipFront.map=dT;flipBack.map=coverIn.map;
      coverIn.map=eT;
    }
    flipFront.needsUpdate=flipBack.needsUpdate=dataMat.needsUpdate=coverIn.needsUpdate=true;
    bend(fwd?0:1);flip.visible=true;current=p;
    turning=tween(1150,t=>bend(fwd?easeIO(t):1-easeIO(t)),()=>{
      if(fwd){coverIn.map=eT;coverIn.needsUpdate=true;}else{dataMat.map=dT;dataMat.needsUpdate=true;}
      flip.visible=false;turning=null;flush();
    });
  }
  function flush(){
    if(!pending||turning||opening)return;
    const p=pending;pending=null;
    if(current&&p.id===current.id)return;
    if(openP>=1&&!REDUCED&&current)turnTo(p);else swapNow(p);
  }
  function setPersona(p,animate){
    if(!current||!animate){swapNow(p);return;}
    pending=p;flush();
  }

  const base={x:-.26,y:-.16};
  let hover={x:0,y:0},drag={x:0,y:0},dragging=null;
  const rot={x:base.x,y:base.y};
  const dom=renderer.domElement;
  const onMove=e=>{
    const r=dom.getBoundingClientRect();
    const nx=(e.clientX-r.left)/r.width-.5, ny=(e.clientY-r.top)/r.height-.5;
    if(dragging){drag.y=Math.max(-.95,Math.min(.95,dragging.dy+(e.clientX-dragging.x)/r.width*2.4));drag.x=Math.max(-.45,Math.min(.45,dragging.dx+(e.clientY-dragging.y)/r.height*1.4));}

  };
  const onDown=e=>{dragging={x:e.clientX,y:e.clientY,dx:drag.x,dy:drag.y};try{dom.setPointerCapture(e.pointerId);}catch(_){}};
  const onUp=e=>{dragging=null;try{dom.releasePointerCapture(e.pointerId);}catch(_){}};
  const onLeave=()=>{hover.x=hover.y=0;};
  dom.addEventListener('pointermove',onMove);dom.addEventListener('pointerdown',onDown);
  dom.addEventListener('pointerup',onUp);dom.addEventListener('pointercancel',onUp);dom.addEventListener('pointerleave',onLeave);
  dom.addEventListener('dblclick',()=>{drag.x=drag.y=0;});

  let camD=0, camTarget=0;
  function fit(){
    const w=el.clientWidth||600,h=el.clientHeight||400;
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
    const vf=camera.fov*Math.PI/180, hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
    camTarget=Math.max(1.12/Math.tan(hf/2),.98/Math.tan(vf/2));
    if(!camD)camD=camTarget;
  }
  const ro=new ResizeObserver(fit);ro.observe(el);fit();
  let visible=true;
  const io=new IntersectionObserver(es=>{visible=es[0].isIntersecting; if(visible) scheduleFrame(); else pauseFrame();});io.observe(el);

  let raf=0,last=performance.now(),alive=true;
  function pauseFrame(){ if(raf){cancelAnimationFrame(raf);raf=0;} }
  function scheduleFrame(){ if(alive && visible && !document.hidden && !raf) raf=requestAnimationFrame(frame); }
  const onVisibility=()=>{ if(document.hidden) pauseFrame(); else scheduleFrame(); };
  document.addEventListener('visibilitychange',onVisibility);
  function frame(now){
    raf=0;if(!alive||!visible||document.hidden)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    tweens=tweens.filter(tw=>{let t=(now-tw.s)/tw.dur;if(t>=1){tw.fn(1);tw.done&&tw.done();return false;}tw.fn(tw.linear?t:t);return true;});
    const k=1-Math.pow(.0015,dt);
    const idle=REDUCED?0:Math.sin(now/2400)*.025;
    rot.x+=(base.x+hover.x+drag.x-rot.x)*k;rot.y+=(base.y+hover.y+drag.y+idle-rot.y)*k;
    root.rotation.set(rot.x,rot.y,0);
    camD+=(camTarget-camD)*(1-Math.pow(.02,dt));
    camera.position.set(0,-.18,camD);camera.lookAt(0,0,0);

    scheduleFrame();
  }
  let shown=false;
  dom.style.opacity='0';dom.style.transition=REDUCED?'none':'opacity .5s ease';
  scheduleFrame();

  return {
    setPersona,setOpen,
    isOpen:()=>openP>.5,
    reset:()=>{drag.x=drag.y=0;},
    nudge:(dx,dy)=>{drag.y=Math.max(-.95,Math.min(.95,drag.y+dx));drag.x=Math.max(-.45,Math.min(.45,drag.x+dy));},
    dispose:()=>{alive=false;pauseFrame();document.removeEventListener('visibilitychange',onVisibility);ro.disconnect();io.disconnect();renderer.dispose();renderer.forceContextLoss?.();el.removeChild(dom);}
  };
}

/* ---------- notices: the registry's colour language ---------- */
const NOTICE = {
  'Valid':       {name:'Green notice',  key:'green',  nc:'var(--g)', nt:'var(--g-tint)', ni:'var(--g-ink)', meaning:'Valid passport', advice:'Review open risks before collaborating.'},
  'Under review':{name:'Yellow notice', key:'yellow', nc:'var(--y)', nt:'var(--y-tint)', ni:'var(--y-ink)', meaning:'Under review', advice:'Wait until the review is finished.'},
  'Suspended':   {name:'Orange notice', key:'orange', nc:'var(--o)', nt:'var(--o-tint)', ni:'var(--o-ink)', meaning:'Suspended', advice:'Do not run campaigns until it is lifted.'},
  'Revoked':     {name:'Red notice',    key:'red',    nc:'var(--r)', nt:'var(--r-tint)', ni:'var(--r-ink)', meaning:'Revoked', advice:'Do not use. Report any copies you find.'}
};
const ORDER = ['Valid','Under review','Suspended','Revoked'];
const nvars = s => ({'--nc':NOTICE[s].nc,'--nt':NOTICE[s].nt,'--ni':NOTICE[s].ni});
const byId = id => PEOPLE.find(p => p.id === id);
const hay = p => (p.name+' '+p.handle+' '+p.id+' '+p.holder+' '+p.lang).toLowerCase();
const find = q => { q = q.trim().toLowerCase(); if(!q) return []; const exact = PEOPLE.filter(p => p.id.toLowerCase()===q || p.handle.toLowerCase()===q || p.handle.toLowerCase()==='@'+q); return exact.length ? exact : PEOPLE.filter(p => hay(p).includes(q)); };
const navigate = token => { if(('#'+token)===location.hash){ window.dispatchEvent(new HashChangeEvent('hashchange')); } else { location.hash = token; } };
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const SAVED_KEY = 'spr-saved-records';
function restoreSaved(value){
  if(!Array.isArray(value)) return [];
  const known = new Set(PEOPLE.map(person => person.id));
  return [...new Set(value.filter(id => typeof id==='string' && known.has(id)))];
}
async function submitToRegistry(path, data){
  if(location.protocol==='file:') return {id:'DEMO-' + (Math.random().toString(36).slice(2,10)).toUpperCase(), demo:true};
  const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  const result = await response.json().catch(() => ({}));
  if(!response.ok) throw new Error(result.error || 'The registry could not save this submission. Please try again.');
  return result;
}

/* ---------- marks ---------- */
let embN = 0;
function Emblem({size, color}){
  const E = EMB; const id = useMemo(() => 'emb' + (++embN), []);
  const star = []; for(let i=0;i<8;i++){ const r=i%2?1.5:4.4, a=-Math.PI/2+i*Math.PI/4; star.push((E.cx+r*Math.cos(a)).toFixed(2)+','+(E.cy-E.gr-8+r*Math.sin(a)).toFixed(2)); }
  return html`<svg width=${size} height=${size} viewBox="0 0 100 100" aria-hidden="true">
    <defs><clipPath id=${id}><circle cx=${E.cx} cy=${E.cy} r=${E.gr}></circle></clipPath></defs>
    <g fill="none" stroke=${color} strokeWidth="1.5">
      <circle cx=${E.cx} cy=${E.cy} r=${E.gr}></circle>
      <g clipPath=${'url(#'+id+')'} strokeWidth="0.9">
        <ellipse cx=${E.cx} cy=${E.cy} rx=${E.gr*.5} ry=${E.gr}></ellipse>
        <ellipse cx=${E.cx} cy=${E.cy} rx=${E.gr*.87} ry=${E.gr}></ellipse>
        <line x1=${E.cx} y1=${E.cy-E.gr} x2=${E.cx} y2=${E.cy+E.gr}></line>
        ${[-.5,0,.5].map(k => html`<line key=${k} x1=${E.cx-E.gr} y1=${E.cy+E.gr*k} x2=${E.cx+E.gr} y2=${E.cy+E.gr*k}></line>`)}
      </g>
      <path d=${E.stemL} strokeWidth="1.1"></path><path d=${E.stemR} strokeWidth="1.1"></path>
    </g>
    <g fill=${color}>
      ${E.leaves.map((l,i) => html`<ellipse key=${i} cx="0" cy="0" rx=${4.4*l.s} ry=${1.75*l.s} transform=${'translate('+l.x.toFixed(2)+' '+l.y.toFixed(2)+') rotate('+l.rot.toFixed(1)+')'}></ellipse>`)}
      <polygon points=${star.join(' ')}></polygon>
    </g>
  </svg>`;
}
function Globe(){
  const R = 48, c = 50, mer = [.18,.42,.64,.82,.95], par = [-.75,-.5,-.25,0,.25,.5,.75];
  return html`<svg className="globe" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <g fill="none" stroke="#fff" strokeWidth="0.18">
      <circle cx=${c} cy=${c} r=${R}></circle>
      ${mer.map(k => html`<ellipse key=${k} cx=${c} cy=${c} rx=${R*k} ry=${R}></ellipse>`)}
      <line x1=${c} y1=${c-R} x2=${c} y2=${c+R}></line>
      ${par.map(k => { const y = c + R*k, w = R*Math.sqrt(1-k*k); return html`<line key=${k} x1=${c-w} y1=${y} x2=${c+w} y2=${y}></line>`; })}
    </g>
  </svg>`;
}

/* ---------- toast ---------- */
function useToast(){
  const [msg,setMsg] = useState(''); const t = useRef(0);
  const show = useCallback(m => { setMsg(m); clearTimeout(t.current); t.current = setTimeout(() => setMsg(''), 2600); }, []);
  return [msg, show];
}
async function copy(text, label, toast){
  try{ await navigator.clipboard.writeText(text); toast(label + ' copied'); }
  catch(e){ toast('Copying is blocked here. Select it by hand: ' + text); }
}

/* ---------- 3D passport ---------- */
function Viewer({person, label}){
  const box = useRef(null), api = useRef(null);
  const latest = useRef(person); latest.current = person;
  const [state,setState] = useState('loading'); const [open,setOpen] = useState(true); const [fb,setFb] = useState('');
  useEffect(() => { let dead = false;
    (async () => { await fontsReady();
      while(!dead){ const selected = latest.current; await loadPhoto(selected); if(selected === latest.current) break; }
      if(dead) return;
      try{ api.current = createViewer(box.current); api.current.setPersona(latest.current, false); setState('ready');
        setTimeout(() => { api.current && api.current.setOpen(true); }, REDUCED ? 0 : 450); }
      catch(e){ setFb(TEX.dataPage(latest.current).toDataURL('image/jpeg', .9)); setState('fallback'); } })();
    return () => { dead = true; api.current && api.current.dispose(); api.current = null; };
  }, []);
  useEffect(() => { let cancelled = false;
    loadPhoto(person).then(() => { if(cancelled || latest.current !== person) return;
      if(api.current) api.current.setPersona(person, true);
      else if(state==='fallback') setFb(TEX.dataPage(person).toDataURL('image/jpeg', .9)); });
    return () => { cancelled = true; };
  }, [person.id]);
  const toggle = () => { const w = !open; setOpen(w); api.current && api.current.setOpen(w); };
  const key = e => { if(!api.current) return; const m = {ArrowLeft:[-.12,0],ArrowRight:[.12,0],ArrowUp:[0,-.08],ArrowDown:[0,.08]}[e.key]; if(m){ e.preventDefault(); api.current.nudge(m[0], m[1]); } };
  return html`<div className="vbox"><div className="viewer" ref=${box} tabIndex="0" role="img" onKeyDown=${key} aria-label=${label || ('Passport ' + person.id + ' of ' + person.name + '. Arrow keys turn it.')}>
    ${state==='loading' && html`<div className="vmsg">Loading the passport</div>`}
    ${state==='fallback' && html`<div className="vmsg"><img src=${fb} alt=${'Data page of passport ' + person.id} /></div>`}
    </div>
    <div className="vctl">
      <span className="hint">${state==='fallback' ? '3D is not available in this browser.' : (window.matchMedia && matchMedia('(hover: none), (pointer: coarse)').matches ? 'Swipe sideways to turn.' : 'Drag to turn. Double-click to straighten.')}</span>
      ${state==='ready' && html`<span className="vbtns">
        <button type="button" className="vbtn" onClick=${toggle}>${open ? 'Close passport' : 'Open passport'}</button>
        <button type="button" className="vbtn" onClick=${() => api.current && api.current.reset()}>Straighten</button></span>`}
    </div>
  </div>`;
}

function Palette({onClose}){
  const [q,setQ] = useState(''); const [act,setAct] = useState(0); const inp = useRef(null); const close = useRef(null); const prev = useRef(document.activeElement);
  useEffect(() => { inp.current && inp.current.focus(); return () => { prev.current && prev.current.focus && prev.current.focus(); }; }, []);
  const people = q.trim() ? find(q) : PEOPLE;
  const actions = [['Browse all notices','notices'],['Register a persona','apply'],['Report a persona','report'],['Registry home','home']].filter(a => !q.trim() || a[0].toLowerCase().includes(q.trim().toLowerCase()));
  const items = [...people.map(p => ({k:p.id, go:p.id, p})), ...actions.map(a => ({k:a[1], go:a[1], label:a[0]}))];
  const go = it => { onClose(); navigate(it.go); };
  const key = e => {
    if(e.key==='ArrowDown'){ e.preventDefault(); setAct(a => Math.min(a+1, items.length-1)); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); setAct(a => Math.max(a-1, 0)); }
    else if(e.key==='Enter'){ e.preventDefault(); items[act] && go(items[act]); }
    else if(e.key==='Escape'){ e.preventDefault(); onClose(); }
    else if(e.key==='Tab'){ e.preventDefault(); close.current && close.current.focus(); }
  };
  let idx = -1;
  const row = it => { idx++; const i = idx; const sel = i===act;
    return it.p ? html`<li key=${it.k} id=${'pi-'+it.k} role="option" aria-selected=${sel?'true':'false'} onMouseMove=${() => setAct(i)} onMouseDown=${e => { e.preventDefault(); go(it); }} style=${nvars(it.p.status)}>
        <img src=${it.p.src} alt="" /><span className="t"><b>${it.p.name}</b><span className="mono">${it.p.id}  ${it.p.handle}</span></span><span className="sw" aria-hidden="true"></span><span className="sr">${NOTICE[it.p.status].name}</span></li>`
      : html`<li key=${it.k} id=${'pi-'+it.k} role="option" aria-selected=${sel?'true':'false'} onMouseMove=${() => setAct(i)} onMouseDown=${e => { e.preventDefault(); go(it); }}><span className="t"><b>${it.label}</b></span></li>`; };
  return html`<div className="pal-bg" onMouseDown=${e => { if(e.target===e.currentTarget) onClose(); }}>
    <div className="pal" role="dialog" aria-modal="true" aria-label="Search the registry">
      <input ref=${inp} value=${q} onChange=${e => { setQ(e.target.value); setAct(0); }} onKeyDown=${key} placeholder="Name, handle, passport number or a page"
        role="combobox" aria-expanded="true" aria-controls="pal-list" aria-activedescendant=${items[act] ? 'pi-'+items[act].k : undefined} aria-label="Search the registry" />
      <button className="close" type="button" ref=${close} onClick=${onClose} onKeyDown=${e => { if(e.key==='Tab'){ e.preventDefault(); inp.current && inp.current.focus(); } else if(e.key==='Escape'){ e.preventDefault(); onClose(); } }}>Close</button>
      <ul id="pal-list" role="listbox" aria-label="Results">
        ${people.length > 0 && html`<li className="grp" role="presentation">Personas</li>`}
        ${items.filter(i => i.p).map(row)}
        ${actions.length > 0 && html`<li className="grp" role="presentation">Pages</li>`}
        ${items.filter(i => !i.p).map(row)}
        ${!items.length && html`<li className="grp" role="presentation">Nothing matches “${q}”. Try a passport number like PP-AZ-0001.</li>`}
      </ul>
      <div className="foot"><span><span className="kbd">↑</span> <span className="kbd">↓</span> to move</span><span><span className="kbd">Enter</span> to open</span><span><span className="kbd">Esc</span> to close</span></div>
    </div>
  </div>`;
}

/* ---------- record ---------- */
const PROV_DATE_TIME = new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
function Record({person, toast, onReport, savedRecords, toggleSaved}){
  const [tab,setTab] = useState('check'); const [step,setStep] = useState(-1); const [checkError,setCheckError] = useState(''); const timers = useRef([]);
  const [provenance,setProvenance] = useState(null); const [provenanceError,setProvenanceError] = useState('');
  useEffect(() => { timers.current.forEach(clearTimeout); timers.current = []; setStep(-1); setTab('check'); }, [person.id]);
  useEffect(() => {
    setProvenance(null); setProvenanceError('');
    if(location.protocol==='file:') return;
    const controller = new AbortController();
    fetch('/api/v1/personas/' + encodeURIComponent(person.id) + '/provenance', {signal:controller.signal})
      .then(async response => { if(!response.ok) throw new Error('Unavailable'); return response.json(); })
      .then(data => { if(data.personaId===person.id) setProvenance(data); })
      .catch(error => { if(error.name!=='AbortError') setProvenanceError('Media integrity information is unavailable.'); });
    return () => controller.abort();
  }, [person.id]);
  const N = NOTICE[person.status];
  const tone = {Valid:'ok','Under review':'warn',Suspended:'bad',Revoked:'bad'}[person.status];
  const checks = [
    {l:'Record exists in the demo register', d:person.id, t:'ok'},
    {l:'Registry record identifier', d:person.record, t:'ok'},
    {l:'Face review shown in the record', d:person.status==='Revoked' ? 'Close match recorded' : person.nature==='Licensed likeness' ? 'Consent noted' : 'No issue recorded', t:person.status==='Revoked' ? 'bad' : 'ok'},
    {l:'Notice', d:N.name, t:tone},
    {l:'Open risks on the record', d:person.risks.length ? String(person.risks.length) : 'None', t:person.risks.length ? 'warn' : 'ok'}
  ];
  const run = async () => { setTab('check'); setCheckError(''); timers.current.forEach(clearTimeout); setStep(-1);
    requestAnimationFrame(() => document.getElementById('tp-check')?.scrollIntoView({behavior:REDUCED ? 'auto' : 'smooth',block:'start'}));
    if(location.protocol!=='file:') {
      try { const r = await fetch('/api/v1/passports/' + encodeURIComponent(person.id) + '/check'); if(!r.ok) throw new Error('Registry lookup failed'); const data = await r.json();
        if(!data.registryRecordFound || data.passportId!==person.id || data.registryMode!=='demonstration' || data.cryptographicSignatureVerified!==false || data.faceComparisonPerformed!==false) throw new Error('Registry response could not be confirmed');
        if(data.notice!==person.status || data.openRiskCount!==person.risks.length || data.evidenceLevel!==person.level) throw new Error('This record has changed. Reload to see its current notice and risks.'); }
      catch(e){ setCheckError(e.message?.startsWith('This record has changed.') ? e.message : 'The registry is unavailable. Please try again.'); return; }
    }
    setStep(0); const g = REDUCED ? 0 : 380; checks.forEach((_,i) => timers.current.push(setTimeout(() => setStep(i+1), g*(i+1)))); };
  const done = step >= checks.length;

const APPLY0 = {name:'', handle:'', nature:'', langs:'', holderType:'', holder:'', email:'', evidence:[]};
const EVIDENCE = [['images','Reference images of the persona'],['models','Model names, versions and file hashes'],['licences','Licences or terms for every tool and model'],['channels','Proof of control of the main channel (without sharing credentials)'],['consent','Signed consent from a real person, if the persona is based on one']];
const EVIDENCE_KEYS = new Set(EVIDENCE.map(([key]) => key));
const HANDLE_FORMAT = /^@?[\p{L}\p{N}_.]{2,80}$/u;
const EMAIL_FORMAT = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const validEmail = value => value.length <= 254 && EMAIL_FORMAT.test(value.trim());
function restoreApplication(raw){
  const draft = {...APPLY0, evidence:[]};
  if(!raw || typeof raw!=='object' || Array.isArray(raw)) return draft;
  for(const key of ['name','handle','nature','langs','holderType','holder','email']) if(typeof raw[key]==='string') draft[key]=raw[key];
  if(Array.isArray(raw.evidence)) draft.evidence=[...new Set(raw.evidence.filter(key => EVIDENCE_KEYS.has(key)))];
  return draft;
}

  const [err,setErr] = useState(null); const [ref,setRef] = useState(null); const [accessToken,setAccessToken] = useState(''); const [demo,setDemo] = useState(false); const [pending,setPending] = useState(false); const [serverError,setServerError] = useState(''); const sum = useRef(null);
  useEffect(() => { if(!ref){ store.set('spr-apply', d); store.set('spr-apply-step', step); } }, [d, step, ref]);
  const set = k => e => setD(s => ({...s, [k]: e.target.value}));
  const toggleEv = k => setD(s => ({...s, evidence: s.evidence.includes(k) ? s.evidence.filter(x => x!==k) : [...s.evidence, k]}));
  const validate = n => { const e = {};
    if(n===1){ if(!d.name.trim() || d.name.trim().length>120) e.name = 'Enter the persona’s public name (up to 120 characters)'; if(!HANDLE_FORMAT.test(d.handle.trim())) e.handle = 'Enter a channel handle with 2 to 80 letters, numbers, dots or underscores'; if(!d.nature) e.nature = 'Select whether the persona is based on a real person'; if(d.langs.length>160) e.langs = 'Enter up to 160 characters for languages'; }
    if(n===2){ if(!d.holderType) e.holderType = 'Select whether a person or a company holds the rights'; if(!d.holder.trim() || d.holder.trim().length>160) e.holder = 'Enter the rights holder name (up to 160 characters)'; if(!validEmail(d.email)) e.email = 'Enter an email address in the correct format, like name@example.com'; }
    if(n===3){ if(!d.evidence.length) e.evidence = 'Select at least one piece of evidence you can send'; if(d.nature==='likeness' && !d.evidence.includes('consent')) e.evidence = 'A persona based on a real person needs that person’s signed consent'; }
    return e; };
  const focusTop = () => setTimeout(() => { const h = document.getElementById('h1'); h && h.focus(); window.scrollTo({top:0}); }, 0);
  const next = e => { e.preventDefault(); const er = validate(step); if(Object.keys(er).length){ setErr(er); setTimeout(() => sum.current && sum.current.focus(), 0); return; } setErr(null); setStep(step + 1); focusTop(); };
  const back = () => { setErr(null); setStep(Math.max(1, step - 1)); focusTop(); };
  const submit = async () => { if(pending) return; setPending(true); setServerError('');
    try { const result = await submitToRegistry('/api/v1/applications', d); setRef(result.id); setAccessToken(result.accessToken || ''); setDemo(!!result.demo); store.del('spr-apply'); store.del('spr-apply-step'); focusTop(); }

    store.del('spr-apply'); store.del('spr-apply-step'); setD({...APPLY0, evidence:[]}); setStep(1); setErr(null); setServerError(''); focusTop(); };
  const fe = k => err && err[k];

  if(ref) return html`<div className="wrap formwrap">

  return html`<div className="wrap formwrap">

function caseEventTitle(item,kind){

async function privateJson(path, token, options={}){

  if(!response.ok) throw new Error(data.error || 'The request failed. Please try again.');

}

/* ---------- shell ---------- */
function parse(){
  let h;
  try { h = decodeURIComponent((location.hash || '').slice(1)); }
  catch { return {name:'home'}; }
  const caseRoute = /^case\/((?:SPR|RPT)-\d{4}-[A-F0-9]{12})\/([A-Za-z0-9_-]{43})$/.exec(h);
  if(caseRoute) return {name:'case', id:caseRoute[1], accessToken:caseRoute[2]};
  const id = h.toUpperCase();
  if(byId(id)) return {name:'record', id};
  if(h==='apply' || h==='report' || h==='notices' || h==='case-status' || h==='review') return {name:h};
  return {name:'home'};
}

  const [route,setRoute] = useState(parse); const routeRef = useRef(route); const prevRef = useRef(null); const [pal,setPal] = useState(false); const [menu,setMenu] = useState(false); const [reportFor,setReportFor] = useState(null); const [msg,toast] = useToast();

  useEffect(() => { store.set(SAVED_KEY, savedRecords); }, [savedRecords]);
  const toggleSaved = id => setSavedRecords(current => current.includes(id) ? current.filter(saved => saved!==id) : [...current,id]);
  useEffect(() => {
    const on = () => { const r = parse(); const go = () => ReactDOM.flushSync(() => setRoute(r));
      const c = routeRef.current, sameRecord = c && c.name==='record' && r.name==='record';
      if(document.startViewTransition && !REDUCED && !sameRecord) document.startViewTransition(go); else go(); };
    window.addEventListener('hashchange', on);
    const k = e => { const typing = /input|textarea|select/i.test((document.activeElement || {}).tagName || '');
      if((e.key==='k' && (e.metaKey || e.ctrlKey)) || (e.key==='/' && !typing)){ e.preventDefault(); setPal(true); } };
    window.addEventListener('keydown', k);
    return () => { window.removeEventListener('hashchange', on); window.removeEventListener('keydown', k); };
  }, []);
  useEffect(() => { setMenu(false); if(route.name!=='report') setReportFor(null); }, [route.name, route.id]);
  useEffect(() => { if(!menu) return; const k = e => { if(e.key==='Escape') setMenu(false); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [menu]);
  useEffect(() => {
    const prev = prevRef.current; prevRef.current = route; routeRef.current = route;
    document.title = route.name==='record' ? byId(route.id).name + ' | Synthetic Persona Registry' : route.name==='apply' ? 'Register a persona | Synthetic Persona Registry' : route.name==='report' ? 'Report a persona | Synthetic Persona Registry' : route.name==='notices' ? 'Notices | Synthetic Persona Registry' : route.name==='case' || route.name==='case-status' ? 'Case status | Synthetic Persona Registry' : route.name==='review' ? 'Review console | Synthetic Persona Registry' : 'Synthetic Persona Registry';
    if(route.name==='notices'){ const el = document.getElementById('notices'); el && el.scrollIntoView({behavior: REDUCED ? 'auto' : 'smooth'}); document.getElementById('n-h')?.focus({preventScroll:true}); return; }
    if(prev && prev.name==='record' && route.name==='record'){ const st = document.querySelector('.rec-stage'); if(st){ const r = st.getBoundingClientRect(); if(r.top < 0 || r.top > window.innerHeight * .6) window.scrollTo({top: Math.max(0, window.scrollY + r.top - 90), behavior: REDUCED ? 'auto' : 'smooth'}); } }
    else window.scrollTo(0, 0);
    const h = document.getElementById('h1'); if(h && route.name!=='home') h.focus({preventScroll:true});
  }, [route]);
  const onReport = p => { setReportFor(p); navigate('report'); };
  const view = route.name==='record' ? html`<${Record} key="rec" person=${byId(route.id)} toast=${toast} onReport=${onReport} savedRecords=${savedRecords} toggleSaved=${toggleSaved} />`
    : route.name==='apply' ? html`<${Apply} toast=${toast} />`
    : route.name==='report' ? html`<${Report} prefill=${reportFor} toast=${toast} />`
    : route.name==='case-status' ? html`<${CaseAccess} />`
    : route.name==='case' ? html`<${CasePage} key=${route.id} caseId=${route.id} accessToken=${route.accessToken} toast=${toast} />`
    : route.name==='review' ? html`<${ReviewConsole} />`
    : html`<${Home} savedRecords=${savedRecords} toggleSaved=${toggleSaved} />`;
  const cur = route.name==='record' || route.name==='notices' ? 'notices' : route.name;
  return html`<div>
    <a className="skip" href="#main" inert=${pal ? '' : undefined} aria-hidden=${pal ? 'true' : undefined} onClick=${e => { e.preventDefault(); const m = document.getElementById('main'); m && m.focus(); }}>Skip to main content</a>
    <div className="util" inert=${pal ? '' : undefined} aria-hidden=${pal ? 'true' : undefined}><div className="wrap"><span><span className="u-long">Independent registry of AI personas. Not a government or police body.</span><span className="u-short">Independent registry, not a government body. Demo data.</span></span><span>Demo data</span></div></div>
    <header className="hdr" inert=${pal ? '' : undefined} aria-hidden=${pal ? 'true' : undefined}><div className="wrap">
      <a className="brand" href="#home" aria-label="Synthetic Persona Registry, home"><${Emblem} size=${50} color="#fff" /><span className="wm" aria-hidden="true"><b>SPR</b><small>SYNTHETIC PERSONA REGISTRY</small></span></a>
      <div className="hbtns">
        <button type="button" className="ibtn" onClick=${() => { setMenu(false); setPal(true); }} aria-label="Search the registry"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-4.6-4.6"></path></svg></button>
        <button type="button" className="ibtn menu" aria-expanded=${menu ? 'true' : 'false'} aria-controls="mainnav" onClick=${() => setMenu(m => !m)}>${menu
          ? html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>`
          : html`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>`}<span>Menu</span></button>
      </div>
      <nav className=${'nav' + (menu ? ' open' : '')} id="mainnav" aria-label="Main">
        <a href="#notices" aria-current=${cur==='notices' ? 'page' : undefined}>Notices</a>
        <a href="#apply" aria-current=${cur==='apply' ? 'page' : undefined}>Register a persona</a>
        <a href="#report" aria-current=${cur==='report' ? 'page' : undefined}>Report</a>
        <a href="#case-status" aria-current=${cur==='case-status' || cur==='case' ? 'page' : undefined}>Case status</a>
        <button type="button" className="kbtn" onClick=${() => setPal(true)} aria-label="Search the registry"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M20 20l-4.6-4.6"></path></svg>Search<span className="kbd" aria-hidden="true">/</span></button>
      </nav>
    </div></header>
    <main id="main" tabIndex="-1" style=${{outline:'none'}} inert=${pal ? '' : undefined} aria-hidden=${pal ? 'true' : undefined}>${view}</main>
    <footer inert=${pal ? '' : undefined} aria-hidden=${pal ? 'true' : undefined}><div className="wrap">
      <div className="fbrand"><${Emblem} size=${56} color="#B9C6DC" /><p style=${{maxWidth:'52ch'}}>The Synthetic Persona Registry is an independent register of AI personas. It is not part of, or endorsed by, any government, police or intergovernmental body. Every entry on this site is demonstration data. Portraits are AI-generated fictional illustrations, not identity or review evidence.</p></div>
      <ul><li><a href="#notices">Notices</a></li><li><a href="#apply">Register a persona</a></li><li><a href="#report">Report a persona</a></li><li><a href="#case-status">Case status</a></li><li><a href="#home">Registry home</a></li></ul>
    </div></footer>
    ${pal && html`<${Palette} onClose=${() => setPal(false)} />`}
    <div className=${'toast' + (msg ? ' show' : '')} role="status" aria-live="polite">${msg}</div>
  </div>`;
}
 async function boot(){
   if(location.protocol!=='file:'){
     try{
       const response=await fetch('/api/v1/personas', {signal:AbortSignal.timeout(3000)});
       if(response.ok){const data=await response.json(); if(Array.isArray(data.personas)) PEOPLE.splice(0,PEOPLE.length,...data.personas.map(p=>({...p,src:PHOTOS[p.id],bodySrc:BODY_PHOTOS[p.id]})));}
     }catch(e){ /* The standalone demo remains available if no backend is present. */ }
   }
   ReactDOM.createRoot(document.getElementById('app')).render(html`<${App} />`);
 }
 boot();
})();
</script>
</body>
</html>
