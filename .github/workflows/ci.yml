name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
      - run: npm run check
      - run: npm test
      - name: Build and smoke-test the runtime image
        run: |
          docker build --tag spr:ci .
          docker run --detach --name spr-ci --publish 127.0.0.1:4176:4176 spr:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4176/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4176/api/v1/health
          curl --fail --silent http://127.0.0.1:4176/ > /dev/null
      - name: Stop smoke container
        if: always()
        run: docker rm --force spr-ci 2>/dev/null || true
