name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.1'
      - run: npm run check
      - run: npm test
      - name: Build and smoke-test the runtime image
        run: |
          docker build --tag spr:ci .
          docker run --detach --name spr-ci --publish 127.0.0.1:4176:4176 spr:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4176/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4176/api/v1/health
          curl --fail --silent http://127.0.0.1:4176/ > /dev/null
      - name: Stop smoke container
        if: always()
        run: docker rm --force spr-ci 2>/dev/null || true
