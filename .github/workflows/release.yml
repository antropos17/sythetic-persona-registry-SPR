name: Publish container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
      - run: npm run check
      - run: npm test
      - name: Build and test the exact image to publish
        run: |
          docker build --tag spr:release .
          docker run --detach --name spr-release --publish 127.0.0.1:4176:4176 spr:release
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4176/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4176/api/v1/health
          curl --fail --silent http://127.0.0.1:4176/ > /dev/null
          curl --fail --silent http://127.0.0.1:4176/assets/portraits/PP-AZ-0001.jpg > /dev/null
          curl --fail --silent http://127.0.0.1:4176/assets/full-body/PP-AZ-0001.jpg > /dev/null
      - name: Stop smoke container
        if: always()
        run: docker rm --force spr-release 2>/dev/null || true
      - name: Publish immutable commit tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/spr:${GITHUB_SHA}"
          docker tag spr:release "$image"
          docker push "$image"
